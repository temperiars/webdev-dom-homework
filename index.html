<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш комментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>

    <script>
      "use strict";
      
      const comments = [
        {
          name: "Глеб Фокин",
          date: "12.02.22 12:18",
          text: "Это будет первый комментарий на этой странице",
          likes: 3,
          isLiked: false,
        },
        {
          name: "Варвара Н.",
          date: "13.02.22 19:22",
          text: "Мне нравится как оформлена эта страница! ❤",
          likes: 75,
          isLiked: true,
        },
      ];

      const commentsList = document.querySelector('.comments');
      const nameInput = document.querySelector('.add-form-name');
      const commentInput = document.querySelector('.add-form-text');
      const addButton = document.querySelector('.add-form-button');

      function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function formatDate(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = String(date.getFullYear()).slice(2);
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${day}.${month}.${year} ${hours}:${minutes}`;
      }

      function handleLikeClick(event) {
        const index = event.target.dataset.index;
        if (index === undefined) return;

        const commentIndex = parseInt(index, 10);
        const comment = comments[commentIndex];
        comment.isLiked = !comment.isLiked;

        if (comment.isLiked) {
          comment.likes += 1;
        } else {
          comment.likes -= 1;
        }

        renderComments();
      }

      function initLikeButtonListeners() {
        const likeButtons = document.querySelectorAll('.like-button');
        likeButtons.forEach((button) => {
          button.removeEventListener('click', handleLikeClick);
          button.addEventListener('click', handleLikeClick);
        });
      }

      function renderComments() {
        const commentsHTML = comments.map((comment, index) => {
          const likeButtonClass = comment.isLiked 
            ? 'like-button -active-like' 
            : 'like-button';

          return `
            <li class="comment" data-index="${index}">
              <div class="comment-header">
                <div>${escapeHTML(comment.name)}</div>
                <div>${comment.date}</div>
              </div>
              <div class="comment-body">
                <div class="comment-text">
                  ${escapeHTML(comment.text)}
                </div>
              </div>
              <div class="comment-footer">
                <div class="likes">
                  <span class="likes-counter">${comment.likes}</span>
                  <button class="${likeButtonClass}" data-index="${index}"></button>
                </div>
              </div>
            </li>
          `;
        }).join('');

        commentsList.innerHTML = commentsHTML;
        initLikeButtonListeners();
      }

      nameInput.addEventListener('input', function() {

      });

      commentInput.addEventListener('input', function() {
     
      });

      addButton.addEventListener('click', function() {
        const name = nameInput.value.trim();
        const commentText = commentInput.value.trim();

        if (name === '') {
          alert('Пожалуйста, укажите ваше имя');
          nameInput.focus();
          return;
        }

        if (commentText === '') {
          alert('Пожалуйста, напишите комментарий');
          commentInput.focus();
          return;
        }

        const newComment = {
          name: name,
          date: formatDate(new Date()),
          text: commentText,
          likes: 0,
          isLiked: false,
        };

        comments.push(newComment);

        nameInput.value = '';
        commentInput.value = '';

        renderComments();

        const lastComment = commentsList.lastElementChild;
        if (lastComment) {
          lastComment.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }
      });
      nameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          addButton.click();
        }
      });

      commentInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.ctrlKey) {
          e.preventDefault();
          addButton.click();
        }
      });

      renderComments();
      console.log("It works!");
    </script>
  </body>
</html>
